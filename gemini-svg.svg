<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" width="760" height="160" fill="none">
  <defs>
    <!-- Deep Space Background Gradient -->
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070f" />
      <stop offset="45%" stop-color="#0b1021" />
      <stop offset="100%" stop-color="#150a21" />
    </linearGradient>

    <!-- Nebula Glow Gradients -->
    <radialGradient id="nebulaCyan" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebulaPurple" cx="85%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#bd34fe" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#bd34fe" stop-opacity="0" />
    </radialGradient>

    <!-- Border Orbit Gradient -->
    <linearGradient id="spaceBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>

    <!-- Planet Gradient -->
    <linearGradient id="planetGrad" x1="20%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="60%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  <!-- Outer Frame -->
  <rect x="2" y="2" width="756" height="156" rx="14" fill="url(#spaceBg)" stroke="url(#spaceBorder)" stroke-width="1.5" />

  <!-- Nebula Clouds -->
  <rect x="2" y="2" width="756" height="156" rx="14" fill="url(#nebulaCyan)" />
  <rect x="2" y="2" width="756" height="156" rx="14" fill="url(#nebulaPurple)" />

  <!-- Vector Starfield -->
  <g fill="#ffffff">
    <!-- Sharp Pinpoint Stars -->
    <circle cx="50" cy="35" r="1" opacity="0.6" />
    <circle cx="110" cy="120" r="1.2" opacity="0.4" />
    <circle cx="180" cy="40" r="0.8" opacity="0.7" />
    <circle cx="260" cy="130" r="1.5" opacity="0.5" />
    <circle cx="340" cy="25" r="0.7" opacity="0.8" />
    <circle cx="430" cy="135" r="1.2" opacity="0.4" />
    <circle cx="510" cy="30" r="1" opacity="0.7" />
    <circle cx="590" cy="125" r="0.8" opacity="0.6" />
    <circle cx="670" cy="45" r="1.4" opacity="0.5" />
    <circle cx="720" cy="110" r="0.9" opacity="0.7" />
    <circle cx="390" cy="140" r="0.8" opacity="0.3" />
    <circle cx="80" cy="80" r="1.6" opacity="0.8" />

    <!-- 4-Point Shimmer Stars -->
    <path d="M 640 30 Q 640 38 648 38 Q 640 38 640 46 Q 640 38 632 38 Q 640 38 640 30 Z" fill="#e0f2fe" opacity="0.85" />
    <path d="M 140 105 Q 140 110 145 110 Q 140 110 140 115 Q 140 110 135 110 Q 140 110 140 105 Z" fill="#fbcfe8" opacity="0.75" />
  </g>

  <!-- Mini Planet with Planetary Orbit Ring -->
  <g transform="translate(680, 80)">
    <!-- Back of Ring -->
    <ellipse cx="0" cy="0" rx="26" ry="7" fill="none" stroke="#a5f3fc" stroke-width="1.2" opacity="0.3" transform="rotate(-20)" />
    <!-- Planet Body -->
    <circle cx="0" cy="0" r="12" fill="url(#planetGrad)" />
    <!-- Front of Ring -->
    <path d="M -24 9 A 26 7 0 0 0 24 -9" stroke="#38bdf8" stroke-width="1.6" fill="none" transform="rotate(-20)" />
  </g>

  <!-- Quote Text Content -->
  <g text-anchor="middle">
    <!-- Subtle Starlight Icon Above Quote -->
    <text x="380" y="44" fill="#38bdf8" font-size="14" opacity="0.9">✦</text>

    <!-- Main Quote -->
    <text x="380" y="82" fill="#f8fafc" font-family="'JetBrains Mono', 'Fira Code', -apple-system, BlinkMacSystemFont, monospace" font-size="19" font-weight="600" letter-spacing="0.4">
      "Imagination is more important than knowledge."
    </text>

    <!-- Author Attribution -->
    <text x="380" y="118" fill="#94a3b8" font-family="'JetBrains Mono', 'Fira Code', -apple-system, BlinkMacSystemFont, monospace" font-size="12" font-weight="500" letter-spacing="3">
      — ALBERT EINSTEIN —
    </text>
  </g>
</svg>
